# Example: override the guard's defaults in your own profile.
#
# Copy the row below into $DSH_HOME/profiles/<name>/cordis.patch.yml — the
# profile's own patch layer is applied AFTER every bundle layer, so it wins.
# Patches replace a row's entire `config` value rather than deep-merging keys,
# so restate every key you want to keep.
#
# Then confirm composition without booting:
#   dsh --profile web --dump-config
- id: process-guard
  name: dsh-process-guard
  config:
    # Route flagged commands to the approval prompt instead of refusing them
    # outright. Useful while tuning, or if you routinely close your own browser
    # from a session: 'deny' | 'ask'.
    mode: ask
    # Extend the built-in shell tool names. Use `tools` only when you intend to
    # replace the defaults entirely.
    additionalTools:
      - remote_shell
    # Extend the cross-platform browser and harness host list. Use
    # `protectedImages` only when you intend to replace the defaults entirely.
    additionalProtectedImages:
      - custombrowser
    # The default is false: command-line text is not proof that you own a
    # process. Opt in only if you accept the positive --headless /
    # --user-data-dir CommandLine filter as sufficient narrowing.
    safeFilterAllows: false
    # Contribute the system-prompt section that states the rule up front.
    announce: true
