name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The package has no runtime dependencies, so the tests run without an
      # install step; nothing is fetched from the network.
      - name: Check the bundle install contract
        run: node scripts/check-bundle.mjs
      - name: Test
        run: node --test --test-reporter=spec test/
