name: publish

on:
  release:
    types: [published]

# Trusted publishing (OIDC): no npm token is stored. `id-token: write` lets npm
# exchange this workflow's identity for a short-lived publish credential, and
# `--provenance` is what drives that exchange.
#
# Do NOT add `registry-url` to setup-node. It writes an .npmrc containing a
# `NODE_AUTH_TOKEN` placeholder, and that placeholder overrides npm's native
# OIDC authentication — the job then fails with an auth error even though
# nothing is wrong with the trusted publisher.
permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Match the release tag to package.json
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Validate release contents
        run: npm run check
      - name: Publish with provenance
        run: npm publish --access public --provenance
